<!DOCTYPE html>
<html lang="en">
<head>
    <title>Map of Viprinet Stations</title>
    <meta property="og:description" content="MapLibre GL JS seismic stations map" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js'></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; width: 100%; }

        .marker {
            background-color: #FF6347;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Basemap vettoriale stabile senza chiavi API
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
            center: [10.4916, 43.9131],
            zoom: 5
        });

        // URL dell'API INGV incapsulato con un CORS Proxy per aggirare il blocco browser
        const ingvUrl = 'https://webservices.ingv.it/fdsnws/station/1/query?station=CUC,VLC,LNSS,MSAG,MRVN,LPEL,GIUL,VIVA,CAMP,ARVD,CESI,PARC,TRIV,MIDA,GALF,RAFF,LATE,TEOL,LPDG,MTTG,ALJA,SOI,PTMD,MILZ,FAVR,CRJA,LINA,GIB,PETRA,MCT,APRC,MELA,MOCO,SGG,MGR,CAR1,GATE,PIPA,MRLC,USI,CAFE,MRB1,MTMR,PAOL,PSB1,PTRJ,VITU,VULT,STAL,SGO,MTGR,MPG,MNO,GMB,ATN,MEU,LATB&level=station&format=text&includerestricted=True&nodata=204';
        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(ingvUrl);

        map.on('load', () => {
            fetch(proxyUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.text();
                })
                .then(data => {
                    const stations = parseStations(data);
                    if (stations.length > 0) {
                        addMarkers(stations);
                        fitMapToMarkers(stations);
                    }
                })
                .catch(error => {
                    console.error('Error fetching seismic stations:', error);
                });
        });

        function parseStations(data) {
            const lines = data.split('\n');
            const stations = [];

            lines.forEach(line => {
                const trimmedLine = line.trim();
                // Ignora le righe vuote o di intestazione con #
                if (trimmedLine && !trimmedLine.startsWith('#')) {
                    const parts = trimmedLine.split('|').map(str => str.trim());
                    if (parts.length >= 4) {
                        const network = parts[0];
                        const station = parts[1];
                        const lat = parseFloat(parts[2]);
                        const lon = parseFloat(parts[3]);

                        if (!isNaN(lat) && !isNaN(lon)) {
                            stations.push({
                                lat: lat,
                                lon: lon,
                                name: `${network}.${station}`
                            });
                        }
                    }
                }
            });

            return stations;
        }

        function addMarkers(stations) {
            stations.forEach(station => {
                const el = document.createElement('div');
                el.className = 'marker';

                new maplibregl.Marker({ element: el })
                    .setLngLat([station.lon, station.lat])
                    .setPopup(new maplibregl.Popup({ offset: 15 }).setText(station.name))
                    .addTo(map);
            });
        }

        function fitMapToMarkers(stations) {
            const lats = stations.map(station => station.lat);
            const lons = stations.map(station => station.lon);
            const bounds = new maplibregl.LngLatBounds(
                new maplibregl.LngLat(Math.min(...lons), Math.min(...lats)),
                new maplibregl.LngLat(Math.max(...lons), Math.max(...lats))
            );
            map.fitBounds(bounds, {
                padding: { top: 50, bottom: 50, left: 50, right: 50 }
            });
        }
    </script>
</body>
</html>
